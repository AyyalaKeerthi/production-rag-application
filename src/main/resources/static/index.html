<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Paper Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .section {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #uploadStatus {
            margin-top: 10px;
        }

        #answer {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            min-height: 50px;
        }

        #sources {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Research Paper Assistant</h1>


<!-- Upload Section -->
<div class="section">

    <h2>Upload Research Paper</h2>

    <input type="file" id="paperFile" accept=".pdf">

    <button onclick="uploadPaper()">
        Upload
    </button>

    <div id="uploadStatus"></div>

</div>


<!-- Question Section -->
<div class="section">

    <h2>Ask a Question</h2>

    <textarea
        id="question"
        placeholder="Ask a question about the research paper...">
    </textarea>

    <br>

    <button onclick="askQuestion()">
        Ask Question
    </button>

</div>


<!-- Answer Section -->
<div class="section">

    <h2>Answer</h2>

    <div id="answer">
        No question asked yet.
    </div>

</div>


<!-- Sources Section -->
<div class="section">

    <h2>Sources</h2>

    <div id="sources">
        No sources yet.
    </div>

</div>


<script>

    async function uploadPaper() {

        const fileInput = document.getElementById("paperFile");
        const status = document.getElementById("uploadStatus");

        if (fileInput.files.length === 0) {
            status.textContent = "Please select a PDF.";
            return;
        }

        const file = fileInput.files[0];

        const formData = new FormData();
        formData.append("file", file);

        status.textContent = "Uploading and processing...";

        try {

            const response = await fetch(
                "/api/papers/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            const result = await response.text();

            if (response.ok) {
                status.textContent = result;
            } else {
                status.textContent =
                    "Upload failed: " + result;
            }

        } catch (error) {

            status.textContent =
                "Error connecting to the server.";

            console.error(error);
        }
    }


    async function askQuestion() {

        const questionInput =
            document.getElementById("question");

        const answerDiv =
            document.getElementById("answer");

        const sourcesDiv =
            document.getElementById("sources");

        const question =
            questionInput.value.trim();

        if (!question) {
            answerDiv.textContent =
                "Please enter a question.";
            return;
        }

        answerDiv.textContent = "Thinking...";
        sourcesDiv.textContent = "";

        try {

            const response = await fetch(
                "/api/questions/search",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                }
            );

            const result = await response.json();
console.log(result);
            if (!response.ok) {

                answerDiv.textContent =
                    "Error: " + JSON.stringify(result);

                return;
            }

            // Display answer
            answerDiv.textContent =
                result.answer;


            // Clear previous sources
            sourcesDiv.innerHTML = "";


            // Display sources
            result.sources.forEach(
                (source, index) => {

                    const sourceElement =
                        document.createElement("div");

                    sourceElement.innerHTML = `
                        <p>
                            <strong>Source ${index + 1}</strong><br>
                            Paper: ${source.paperName}<br>
                            Page: ${source.pageNumber}<br>
                            Chunk: ${source.chunkId}
                        </p>
                    `;

                    sourcesDiv.appendChild(
                        sourceElement
                    );
                }
            );

        } catch (error) {

            answerDiv.textContent =
                "Error connecting to the server.";

            console.error(error);
        }
    }

</script>

</body>

</html>
